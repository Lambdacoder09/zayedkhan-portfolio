el">Component details</div><div><h2 id="infoTitle">Select a component</h2><p id="infoText">Search, filter, zoom, or select any node in the map.</p><div id="infoFlow" class="flow"></div></div></section></main><script>
const svg=document.querySelector('#diagram');
const nodes=[...svg.querySelectorAll('.node')],edges=[...svg.querySelectorAll('.edge')];
const search=document.querySelector('#search'),category=document.querySelector('#category');
const zoomTarget=document.querySelector('#canvasShell svg');let zoom=1;
const categories=[...new Set(nodes.map(n=>n.dataset.category))];
const names={client:'Client / device',frontend:'Frontend',app:'App / API',database:'Database',cloud:'Cloud',security:'Security',service:'External service'};
for(const key of categories){const o=document.createElement('option');o.value=key;o.textContent=names[key]||key;category.appendChild(o)}
function update(){const q=search.value.trim().toLowerCase(),kind=category.value;let matched=new Set();for(const n of nodes){const ok=(!q||n.dataset.search.toLowerCase().includes(q))&&(!kind||n.dataset.category===kind);n.classList.toggle('dimmed',!ok);if(ok)matched.add(n.dataset.id)}for(const e of edges)e.classList.toggle('dimmed',!matched.has(e.dataset.from)||!matched.has(e.dataset.to))}
search.addEventListener('input',update);category.addEventListener('change',update);
for(const n of nodes){const select=()=>{nodes.forEach(x=>x.classList.toggle('selected',x===n));edges.forEach(e=>e.classList.toggle('active',e.dataset.from===n.dataset.id||e.dataset.to===n.dataset.id));document.querySelector('#infoTitle').textContent=n.dataset.title;document.querySelector('#infoText').textContent=n.dataset.detail;document.querySelector('#infoFlow').textContent='Flow: '+(n.parentElement.previousElementSibling?.dataset?.row!==undefined?'see adjacent arrows':'shared component path')};n.addEventListener('click',select);n.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();select()}})}
document.querySelector('#zoomIn').addEventListener('click',()=>{zoom=Math.min(1.8,zoom+.1);zoomTarget.style.width=(zoom*100)+'%'});document.querySelector('#zoomOut').addEventListener('click',()=>{zoom=Math.max(.7,zoom-.1);zoomTarget.style.width=(zoom*100)+'%'});document.querySelector('#fit').addEventListener('click',()=>{zoom=1;zoomTarget.style.width='100%';document.querySelector('#canvasShell').scrollTo({left:0,top:0,behavior:'smooth'})});
document.querySelector('#fullscreen').addEventListener('click',async()=>{const shell=document.querySelector('#canvasShell');if(!document.fullscreenElement)await shell.requestFullscreen?.();else await document.exitFullscreen?.()});
document.querySelector('#exportSvg').addEventListener('click',()=>{const copy=svg.cloneNode(true);copy.removeAttribute('id');const blob=new Blob([new XMLSerializer().serializeToString(copy)],{type:'image/svg+xml;charset=utf-8'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=document.body.dataset.slug+'.svg';a.click();URL.revokeObjectURL(a.href)});
document.querySelector('#exportPng').addEventListener('click',()=>{const copy=svg.cloneNode(true);copy.removeAttribute('id');const source=new XMLSerializer().serializeToString(copy);const image=new Image();const url=URL.createObjectURL(new Blob([source],{type:'image/svg+xml;charset=utf-8'}));image.onload=()=>{const c=document.createElement('canvas');c.width=Number(svg.getAttribute('width'));c.height=Number(svg.getAttribute('height'));c.getContext('2d').drawImage(image,0,0);URL.revokeObjectURL(url);c.toBlob(b=>{const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download=document.body.dataset.slug+'.png';a.click();URL.revokeObjectURL(a.href)},'image/png')};image.src=url});
</script></body></html>
